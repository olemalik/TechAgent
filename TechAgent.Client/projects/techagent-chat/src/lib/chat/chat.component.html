<div class="chat-container"
  (dragenter)="onDragEnter($event)"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)">

  <!-- Drop overlay -->
  @if (isDragging()) {
    <div class="drop-overlay">
      <div class="drop-overlay-inner">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.42 16.41a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
        <span>Drop to attach file</span>
      </div>
    </div>
  }

  <div class="message-area">
    <ta-chat-messages
      [messages]="messages()"
      [isLoading]="isLoading()"
      [hasMessages]="hasMessages()"
      [currentUser]="currentUser"
      [aiUser]="aiUser"
      (feedbackSubmit)="onFeedback($event)" />
  </div>

  <div class="chat-footer">
    <ta-chat-input
      [streamingDisabled]="isLoading()"
      (messageSend)="onSend($event)" />
  </div>

</div>
