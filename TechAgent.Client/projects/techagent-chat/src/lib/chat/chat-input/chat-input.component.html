<div class="input-wrapper" [class.active]="text().trim() || fileUploader.pendingFile()">

  <!-- Syncfusion-backed file uploader in chat mode (paperclip + badge) -->
  <ta-file-uploader
    #fileUploader
    mode="chat"
    [disabled]="streamingDisabled || uploading()" />

  <textarea
    #textarea
    placeholder="Ask about oil &amp; gas…"
    rows="1"
    [disabled]="streamingDisabled"
    (input)="onInput($event)"
    (keydown.enter)="onEnterKey($event)">
  </textarea>

  <button
    class="send-btn"
    [class.ready]="canSend()"
    [disabled]="!canSend()"
    title="Send message"
    (click)="submit()">
    @if (uploading() || streamingDisabled) {
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
        class="spin">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5 12 12 5 19 12"/>
      </svg>
    }
  </button>
</div>

<p class="footer-hint">
  Press <kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> for new line
</p>
