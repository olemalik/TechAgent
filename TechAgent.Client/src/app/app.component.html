<div class="layout">

  <div class="sidebar-wrapper" [class.collapsed]="!sidebarOpen">
    <app-sidebar
      [activeSessionId]="activeSessionId"
      [refreshSignal]="sidebarRefresh"
      (sessionSelected)="selectSession($event)"
      (sessionDeleted)="onSessionDeleted($event)"
      (newChatRequested)="newChat()"
      (toggleRequested)="toggleSidebar()" />
  </div>

  <div class="content-area">

    <div class="topbar">
      <!-- Hamburger: invisible placeholder when sidebar open so title stays aligned -->
      <button class="topbar-btn" [class.visible]="!sidebarOpen"
              title="Open sidebar" (click)="toggleSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <span class="topbar-title">TechAgent AI</span>

      <div class="topbar-spacer"></div>

      <!-- Documents tab -->
      <button class="topbar-btn visible" [class.active]="view === 'documents'"
              title="Knowledge Base" (click)="view = view === 'documents' ? 'chat' : 'documents'">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </button>

      <!-- Dark / light toggle -->
      <button class="topbar-btn visible" (click)="theme.toggle()"
              [title]="theme.isDark ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (theme.isDark) {
          <!-- Sun -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        } @else {
          <!-- Moon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>
    </div>

    <div class="chat-wrapper">
      @if (view === 'documents') {
        <app-documents />
      } @else {
        @for (k of [chatKey]; track k) {
          <app-chat (sessionCreated)="onSessionCreated($event)" />
        }
      }
    </div>

  </div>
</div>
