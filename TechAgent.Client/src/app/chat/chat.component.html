<div class="chat-container">

  <!-- Message area: Syncfusion handles display only (footer hidden via CSS) -->
  <div class="message-area">
    @if (!hasMessages) {
      <div class="welcome-overlay">
        <div class="welcome-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1 class="welcome-title">Welcome to Oil and Gas Agent</h1>
        <p class="welcome-sub">Ask me anything about drilling, production, HSE,<br>reservoir engineering, pipelines, or refining.</p>
      </div>
    }

    <ejs-chatui
      #chatUI
      [user]="currentUser"
      [messages]="messages"
      [showTimeBreak]="true">
    </ejs-chatui>
  </div>

  <!-- Custom footer with send button -->
  <div class="custom-footer">
    <div class="input-wrapper" [class.focused]="inputHasText">
      <textarea
        #messageInput
        placeholder="Ask about oil &amp; gas..."
        rows="1"
        (input)="onInput($event)"
        (keydown.enter)="onEnterKey($event)">
      </textarea>

      <button
        class="send-btn"
        [class.active]="inputHasText && !isLoading"
        [disabled]="!inputHasText || isLoading"
        (click)="sendMessage()"
        title="Send message">
        @if (isLoading) {
          <!-- Spinner -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        } @else {
          <!-- Arrow up -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        }
      </button>
    </div>

    <p class="footer-hint">Press <kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> for new line</p>

    @if (isLoading) {
      <div class="typing-indicator">
        <span></span><span></span><span></span>
        <span class="typing-label">TechAgent AI is thinking…</span>
      </div>
    }
  </div>

</div>
