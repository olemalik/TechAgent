services:
  techagent-api:
    environment:
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__ChatId=${TELEGRAM_CHAT_ID}
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - Claude__ApiKey=${CLAUDE_API_KEY}
  qdrant:
    image: qdrant/qdrant:latest
    container_name: techagent-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + web dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC — used by Qdrant.Client SDK in TechAgent
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

volumes:
  qdrant_storage:

# ─── Notes ───────────────────────────────────────────────────────────────────
# Ollama is NOT in Docker — it runs on the HOST to access GPU acceleration.
# Start Ollama with:  ollama serve
#
# PostgreSQL is also NOT here — assumed already running (existing TechAgent DB).
# If you need PostgreSQL too, add:
#   postgres:
#     image: postgres:16-alpine
#     environment:
#       POSTGRES_DB: techagent
#       POSTGRES_USER: postgres
#       POSTGRES_PASSWORD: your_password_here
#     ports: ["5432:5432"]
#     volumes: ["pgdata:/var/lib/postgresql/data"]
